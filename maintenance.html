<script>
  const themes = Object.keys(MANIFEST);
  const tabs = document.getElementById('tabs');
  const main = document.getElementById('main');
  const filter = document.getElementById('filter');
  let current = themes[0];

  function addTab(name) {
    const button = document.createElement('button');
    button.textContent = name;
    button.onclick = () => { current = name; render(); };
    tabs.appendChild(button);
  }
  ['OVERVIEW', 'ALL', ...themes].forEach(addTab);

  function groupKey(file) {
    return file.replace(/\.png$/, '').replace(/-[A-Z](-ACTIVE)?$/, '');
  }

  function renderTheme(theme, query) {
    const groups = {};
    let shown = 0;
    for (const file of MANIFEST[theme]) {
      if (query && !(theme + '/' + file).toLowerCase().includes(query)) continue;
      (groups[groupKey(file)] ||= []).push(file);
      shown++;
    }
    const section = document.createElement('section');
    if (current === 'ALL' && shown) {
      const title = document.createElement('h2');
      title.textContent = theme;
      title.style.cssText = 'font-size:18px;border-bottom:1px solid #444;padding-bottom:4px';
      section.appendChild(title);
    }
    for (const [key, files] of Object.entries(groups)) {
      const group = document.createElement('div');
      group.className = 'group';
      group.innerHTML = `<h2>${key.replace(/-/g, ' ')} <span>(${files.length})</span></h2>`;
      const row = document.createElement('div');
      row.className = 'row';
      for (const file of files) {
        const fig = document.createElement('figure');
        if (file.includes('ACTIVE')) fig.classList.add('active');
        const src = `/assets/images/maintenance/hexes/${theme}/${file}`;
        fig.innerHTML = `<img loading="lazy" src="${src}" alt="${file}"><figcaption>${file.replace(key + '-', '').replace('.png', '')}</figcaption>`;
        fig.onclick = () => showZoom(src, `${theme} / ${file}`);
        row.appendChild(fig);
      }
      group.appendChild(row);
      section.appendChild(group);
    }
    main.appendChild(section);
    return shown;
  }

  function render() {
    [...tabs.children].forEach(b => b.classList.toggle('on', b.textContent === current));
    main.innerHTML = '';
    const query = filter.value.trim().toLowerCase();
    if (current === 'OVERVIEW') {
      main.innerHTML = '<div id="overview"><img src="/assets/images/maintenance/hexes/overviewALL.jpg" alt="Overview of all themes"></div>';
      document.getElementById('count').textContent = '';
      return;
    }
    let total = 0;
    for (const theme of (current === 'ALL' ? themes : [current])) total += renderTheme(theme, query);
    document.getElementById('count').textContent = total + ' tiles';
  }

  const zoom = document.getElementById('zoom');
  function showZoom(src, label) {
    zoom.querySelector('img').src = src;
    zoom.querySelector('p').textContent = label;
    zoom.classList.add('show');
  }
  zoom.onclick = () => zoom.classList.remove('show');
  document.addEventListener('keydown', event => { if (event.key === 'Escape') zoom.classList.remove('show'); });

  filter.oninput = render;
  document.getElementById('size').oninput = event => document.body.style.setProperty('--size', event.target.value + 'px');
  document.getElementById('light').onchange = event => document.body.classList.toggle('light', event.target.checked);
  current = themes[0];
  render();
</script>
