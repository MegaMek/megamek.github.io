<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
  <link rel="canonical" href="{{ page.redirect_to | relative_url }}">
  <!-- The meta refresh drops the #section part of a link; this keeps it -->
  <script>location.replace("{{ page.redirect_to | relative_url }}" + location.hash);</script>
</head>
<body>
  <p>Redirecting to <a href="{{ page.redirect_to | relative_url }}">{{ page.redirect_to }}</a>...</p>
</body>
</html>
