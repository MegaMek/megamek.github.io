# Records a daily snapshot of cumulative GitHub release download counts so the
# website can show downloads-per-day. Only aggregate integers are stored; no
# visitor or personal data is involved.
name: Snapshot download counts

on:
  # Runs once a day. Time is off the hour to be polite to shared runners.
  schedule:
    - cron: "17 6 * * *"

  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# Needs write access to commit the updated data file back to the repo.
permissions:
  contents: write

# Never run two snapshots at once.
concurrency:
  group: "download-snapshot"
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Record release download totals
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = 'assets/data/download_history.json';
            const repos = ['megamek', 'megameklab', 'mekhq'];
            const today = new Date().toISOString().slice(0, 10);

            // The milestone version is the site's own "stable" pointer. The
            // per-version charts track this plus the three most recent releases.
            const releasesYml = fs.readFileSync('_data/current_releases.yml', 'utf8');
            const milestoneMatch = releasesYml.match(/^stable:\s*(.+?)\s*$/m);
            const milestone = milestoneMatch ? milestoneMatch[1].trim() : null;

            // Strip a leading "v" so tags (v0.50.11) match yml values (0.50.11).
            const normalize = (tag) => tag.replace(/^v/, '');

            // Only program packages count as downloads. Releases also carry
            // files nobody installs: the launcher's suite-record-*.json (read
            // on every update check, so its count is checks, not downloads),
            // plus a few old changelogs and tile atlases. Add a new package
            // format here if the builds ever ship one.
            const isPackage = (name) => /\.(zip|tar\.gz|tgz|tar\.bz2|7z)$/i.test(name);

            // Marks history entries counted packages-only. The charts skip the
            // one day that spans an older all-files entry and a packages entry,
            // so the switch does not plot as a drop.
            const basis = 'packages';

            let data = { updated: null, repos: {} };
            if (fs.existsSync(path)) {
              data = JSON.parse(fs.readFileSync(path, 'utf8'));
            }
            if (!data.repos) {
              data.repos = {};
            }

            // Every published release with its current download count, for the
            // grouped Download Stats table. Rewritten in full each run.
            const releaseTable = { updated: today, repos: {} };

            for (const repo of repos) {
              const releases = await github.paginate(
                github.rest.repos.listReleases,
                { owner: 'MegaMek', repo, per_page: 100 }
              );

              let total = 0;
              const downloadsByVersion = {};
              const releaseList = [];
              for (const release of releases) {
                let releaseDownloads = 0;
                for (const asset of release.assets) {
                  if (isPackage(asset.name)) {
                    releaseDownloads += asset.download_count;
                  }
                }
                total += releaseDownloads;
                downloadsByVersion[normalize(release.tag_name)] = releaseDownloads;

                if (!release.draft && release.published_at) {
                  releaseList.push({
                    tag: release.tag_name,
                    name: release.name || '',
                    date: release.published_at.slice(0, 10),
                    prerelease: release.prerelease,
                    downloads: releaseDownloads
                  });
                }
              }
              releaseTable.repos[repo] = releaseList;

              // Track the milestone plus the three most recently published
              // releases, de-duplicated (the milestone is often among them).
              const recent = [...releases]
                .sort((a, b) => new Date(b.published_at) - new Date(a.published_at))
                .slice(0, 3)
                .map((release) => normalize(release.tag_name));
              const tracked = [...new Set([milestone, ...recent].filter(Boolean))];

              const versions = {};
              for (const version of tracked) {
                if (downloadsByVersion[version] != null) {
                  versions[version] = downloadsByVersion[version];
                }
              }

              if (!data.repos[repo]) {
                data.repos[repo] = [];
              }
              const series = data.repos[repo];
              const last = series[series.length - 1];

              if (last && last.date === today) {
                // A re-run on the same day overwrites that day's value.
                last.total = total;
                last.versions = versions;
                last.basis = basis;
              } else {
                series.push({ date: today, total: total, versions: versions, basis: basis });
              }
            }

            data.updated = today;
            fs.mkdirSync('assets/data', { recursive: true });
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
            fs.writeFileSync('assets/data/releases.json', JSON.stringify(releaseTable, null, 2) + '\n');

      # Keeps the home and Downloads launcher links on the newest launcher
      # release. A release is only taken once all six installers are on it, so a
      # half-uploaded release never produces broken links. Any problem here
      # keeps the previous version and does not stop the download snapshot.
      - name: Record the latest launcher release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '_data/launcher_release.json';
            const installers = [
              'windows-x64.msi',
              'macos-apple-silicon.pkg',
              'macos-intel.pkg',
              'linux-x64.deb',
              'linux-x64.rpm',
              'linux-x64-portable.tar.gz'
            ];

            try {
              const { data: release } = await github.rest.repos.getLatestRelease({
                owner: 'MegaMek',
                repo: 'mm-launcher'
              });
              const version = release.tag_name.replace(/^v/, '');
              const assetNames = release.assets.map((asset) => asset.name);
              const missing = installers.filter(
                (installer) => !assetNames.includes(`MegaMek-Launcher-${version}-${installer}`)
              );

              if (missing.length > 0) {
                core.warning(`Launcher ${version} is missing ${missing.join(', ')}; keeping the previous version.`);
                return;
              }

              const launcherRelease = {
                version: version,
                date: release.published_at.slice(0, 10)
              };
              fs.writeFileSync(path, JSON.stringify(launcherRelease, null, 2) + '\n');
              core.info(`Launcher links now point at ${version}.`);
            } catch (error) {
              core.warning(`Could not read the latest launcher release: ${error.message}`);
            }

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/download_history.json assets/data/releases.json _data/launcher_release.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update download history ($(date -u +%Y-%m-%d))"
            git push
          fi
